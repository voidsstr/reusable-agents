# keep-the-lights-on — system config for specpicks.com
# Generic runbook is ../SKILL.md; all site-specific values live here.
# Start in a session with: "keep the lights on for specpicks".

system: specpicks
display_name: SpecPicks (specpicks.com) — PC hardware / retro reviews + buying guides

# ── Overarching growth North Star ──
# Success = more people using specpicks REGULARLY. Not code shipped, not
# articles published — user behavior. Bias every improvement toward these.
growth:
  north_star: "Grow regular usage of specpicks.com (returning users, DAU, organic clicks, indexed pages, Amazon + eBay affiliate conversions)."
  proxies:
    - name: articles_24h
      sql: "select count(*) from editorial_articles where created_at > now() - interval '24 hours'"
      db: specpicks
      note: "publish pulse — leading indicator of indexable surface area. specpicks runs hot (~40-50/day)."
    - name: published_total
      sql: "select count(*) from editorial_articles where status='published'"
      db: specpicks
      note: "catalog depth (~1,998 as of 2026-07-06)."

# ── Critical agents to keep alive (the specpicks pipeline) ──
agents:
  critical:
    - specpicks-article-proposal-agent          # Opus proposer (volume engine)
    - specpicks-seo-opportunity-agent            # SEO recs (GSC-driven)
    - specpicks-progressive-improvement-agent    # site quality + deployer
    - specpicks-head-to-head-agent               # h2h verdicts (Opus content)
    - backlog-dispatcher-agent                   # shared: feeds implementer
  # shared drainer (not per-site): auto-queue-drainer.service
  supporting:
    - specpicks-catalog-audit-agent
    - specpicks-benchmark-research-agent
    - specpicks-ebay-product-sync-agent          # retro -> eBay ingest (:30 hourly)
    - specpicks-product-hydration-agent
    - specpicks-competitor-research-agent
    - specpicks-competitor-gap-consumer
    - specpicks-youtube-review-agent
    - specpicks-amazon-price-verifier
    - specpicks-schema-fix-specialist
    - specpicks-internal-link-densifier
    - specpicks-stale-content-watcher
    - specpicks-scraper-watchdog
    - specpicks-gsc-coverage-auditor
    - specpicks-indexnow-submitter
    - specpicks-indexnow-bulk
    - specpicks-article-hero-image-curator
    - specpicks-news-hero-image-curator
    - specpicks-site-goals-tracker

# ── Databases (env-var names in ~/.reusable-agents/secrets.env) ──
# source with `set -a; . secrets.env; set +a` (plain KEY=val, not exported).
# psql is NOT installed — query via python3 + psycopg2.
db:
  specpicks: DATABASE_URL_SPECPICKS

# ── Live URLs to HTTP-probe (specpicks articles are at /reviews/<slug>; 301 from /articles/) ──
urls:
  homepage: https://specpicks.com/
  sample_article: https://specpicks.com/reviews/linux-7-3-flattens-the-pick-gaming-benchmarks
  # If that slug ever 404s, pick any current published /reviews/<slug> (query
  # editorial_articles). Homepage is the primary up/down signal.

# ── Escalation recipient (fleet operator; NEVER a personal inbox) ──
owner_email: mperry@northernsoftwareconsulting.com

# ── Known-excluded failure patterns (documented non-issues — do NOT re-flag) ──
known_excluded:
  - agent: digest-rollup-agent
    reason: "O365 'automation' SMTP relay is tenant-disabled; digest send fails. Operator-gated. send_via_msmtp tries Graph first, so verify each send's ok flag + fall back to in-session."
  - agent: specpicks-amazon-price-verifier
    pattern: "BrightData refresh failed (rc=1)"
    reason: "proxy credential issue; surface ONCE then suppress (not a pipeline blocker)."
  - agent: specpicks-progressive-improvement-agent
    pattern: "deployer stage failed"
    reason: "known legacy playwright.config.ts smoke suite fails at the deployer stage; does NOT gate article authoring/publishing."
  - agent: specpicks-benchmark-research-agent
    pattern: "DDG / DuckDuckGo timeout"
    reason: "DuckDuckGo flaky; agent retries next run."
  - agent: specpicks-seo-opportunity-agent
    pattern: "collector exited rc=1"
    reason: "GSC OAuth refresh window; auto-recovers when the shared token refresher runs (token re-minted 2026-07-01)."
  - pattern: "hero-image-curator TimeoutExpired"
    reason: "vision call occasionally slow; curator retries."
  - pattern: "indexed 0/NN"
    reason: "gsc-coverage-auditor local JSONL may be stale; vanity metric, does not gate volume."

# ── Cadence (seconds) ──
cadence:
  healthy: 1800
  degraded: 240
  down: 180
  blocked_backoff: 3600

# ── Improvement cadence ──
improvement_every_hours: 8   # specpicks article-proposal is 8-hourly (:45 offsets); one focused lever per cycle

# ── Site-specific QUALITY CONTRACTS to respect in any improvement (from CLAUDE.md) ──
# These are enforced by existing agents; an improvement cycle must NOT violate them:
quality_contracts:
  - "Pricing integrity: never promote a Top Pick with an invalid price — filters price>=1.0, currency USD-only, no negative discount, category_confidence>=0.5."
  - "Retro / pre-2012 hardware routes to eBay, NOT Amazon (era='retro' / listing_preference='ebay' / release_year<2012). A 'Buy on Amazon' CTA on a 2002 GPU is a dead page."
  - "Editorial prose (article/news/h2h) is Opus-ONLY; defer rather than fall back to a smaller model."
  - "SSR must render GFM tables (AggregateRating + comparison tables). specpicks articles live at /reviews/<slug>."

# ── Standing incidents (operator-gated — do NOT action without go-ahead) ──
standing_incidents: []   # none open as of 2026-07-06

# ── Context / history ──
history:
  - 2026-07-06: "KTLO config created for specpicks (mirrors aisleprompt setup). specpicks pipeline was already healthy: ~50 articles/24h, 1,998 published, homepage + /reviews/ 200, GSC OAuth healthy (token re-minted 2026-07-01), pool 4/6 profiles. No open incidents at setup."
