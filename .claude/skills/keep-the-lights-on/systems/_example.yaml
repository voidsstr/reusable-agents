# ── Functional verification (Playwright/e2e against PROD) ── (see SKILL §5b)
# Full suite against the LIVE site >= once/day AND after any prod change.
# Running tests is pure shell (no LLM tokens); LLM only triages/patches a
# FAILURE or deepens coverage. Omit this block if the system has no e2e suite.
functional_tests:
  runner: playwright                                   # or whatever the site uses
  cwd: /home/voidsstr/development/<site>               # dir to run from (where the config resolves)
  target: production
  base_url: https://<site>.com
  full_cmd:  "TEST_URL=https://<site>.com npx playwright test --config=playwright.config.ts --reporter=line --workers=6"
  smoke_cmd: "TEST_URL=https://<site>.com npx playwright test --config=playwright.config.ts --grep @smoke --reporter=line --workers=6"
  total_tests: 0              # keep updated as the suite grows
  run_every_hours: 24         # full suite at least daily
  run_smoke_after_prod_change: true   # + smoke after any prod change since last run
  coverage_areas:             # what "all functionality in depth" must cover (audit + expand each improvement cycle)
    - homepage / SEO / structured data
    - primary content pages — SSR body + hydration + internal links
    - catalog / listing pages
    - navigation (desktop + mobile)
    - affiliate / conversion CTAs
    - buy box (top pick above the fold, primary + sticky button uncovered) — when conversion: is set
    - sitemap + robots

# ── Standing incidents (operator-gated — do NOT action without go-ahead) ──
standing_incidents:
  - id: aisleprompt-articles-not-indexable
    severity: high
    summary: >
      Articles are not indexable/discoverable: (A) crawlers get an empty
      SPA shell with a generic homepage <title> for every article URL
      (systemic — a 5-day-old article behaves the same); (B) sitemap.xml
      has only ~8 <loc> entries and sitemap-articles.xml is empty, so the
      ~145 published articles are absent. This is the highest-leverage
      North-Star lever (volume is invisible to Google until fixed) but it
      is APP-INFRA (frontend SSR + sitemap generation), not agent tuning.
    flagged: 2026-07-06
    next_step: >
      On operator go-ahead, START with the low-risk high-certainty sitemap
      fix (get the ~145 articles into sitemap-articles.xml — investigate
      the aisleprompt frontend/sitemap-generation code first). The SSR
      angle needs a real-Googlebot check (spoofed UA may not equal
      reverse-DNS-verified Googlebot) before any live-app change.
    caveat: >
      Editorial content quality/link-guard is intact; the blocker is
      purely discoverability/rendering.

