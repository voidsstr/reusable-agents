# Example editorial calendar for agents/affiliate-article-agent (format:
# framework/core/editorial_calendar.py). Topics are written in order once their
# data requirements hold; used by site.example.yaml and the engine's tests.
version: 1
entries:
- id: fridge-24h-outage
  order: 20
  slug: best-power-station-refrigerator-24-hour-outage
  working_title: Best power station to keep a refrigerator running through a 24-hour outage
  format: best-for
  lane: station
  occasion: winter-storm-season
  brief: 'How the refrigerator''s type changes the answer on the same station: the presets for full-size, top-freezer,
    French-door and side-by-side refrigerators differ in daily energy, so the same station covers a different share
    of a 24-hour outage. Then the ranked picks.'
  questions:
  - How many hours does the same station give a top-freezer, a French-door and a side-by-side refrigerator?
  - Which stations both start the compressor and carry a full-size refrigerator for 24 hours?
  - What does 'usable' capacity mean for this answer, and where does the range come from?
  link_instead_of_repeating:
  - /runtime/refrigerator
  - /best/power-station-for-refrigerator
  placeholders:
  - '{{picks:power-station-for-refrigerator}}'
  scope:
    presets:
    - refrigerator
    - refrigerator-top-freezer
    - refrigerator-french-door
    - refrigerator-side-by-side
    lists:
    - power-station-for-refrigerator
  scenario:
    h:
    - 24
  requires:
  - check: runtime_stations
    min: 12
    params:
      preset: refrigerator
  - check: surge_checked_stations
    min: 10
    params:
      preset: refrigerator
  - check: list_picks
    min: 3
    params:
      list: power-station-for-refrigerator
  - check: compat_hubs_live
    min: 2
- id: starlink-and-wifi-outage
  order: 30
  slug: power-station-for-starlink-and-wifi-in-an-outage
  working_title: Best power station for Starlink and home Wi-Fi in an outage
  format: best-for
  lane: station
  occasion: winter-storm-season
  brief: 'Staying online in an outage: a cable router and modem, Starlink Standard and Starlink Mini are three different
    loads. Compare the hours one station gives each (FACTS runtimes), then the ranked picks. Never add loads together:
    give each load''s hours separately.'
  questions:
  - On the same station, how many hours for the router and modem alone, for Starlink Mini and for Starlink Standard?
  - Which stations carry Starlink Standard through a 12-hour night?
  - Why does Starlink Mini change the station size you need?
  link_instead_of_repeating:
  - /runtime/starlink-standard
  - /runtime/starlink-mini
  - /runtime/wifi-router-modem
  placeholders:
  - '{{picks:power-station-for-starlink}}'
  scope:
    presets:
    - wifi-router-modem
    - starlink-mini
    - starlink-standard
    lists:
    - power-station-for-starlink
  scenario:
    h:
    - 12
  requires:
  - check: runtime_stations
    min: 10
    params:
      preset: starlink-standard
  - check: runtime_stations
    min: 10
    params:
      preset: wifi-router-modem
  - check: list_picks
    min: 3
    params:
      list: power-station-for-starlink
  - check: compat_hubs_live
    min: 2
- id: expansion-battery-fit
  order: 40
  slug: expansion-batteries-and-the-stations-they-fit
  working_title: Every expansion battery and the stations it fits
  format: compatibility explainer
  lane: expansion
  brief: 'Maker-listed fits only (FACTS compat rows with relation ''expands''): which expansion battery works with
    which station, how much capacity each adds (other_capacity_wh), and the station''s own expansion limits (max_expansion_units,
    max_expansion_wh). Stations with no listed battery are named as such.'
  questions:
  - Which expansion batteries does each station accept, according to its maker?
  - How much capacity does one battery add, and how many units does the station take?
  - Which stations in our data take no expansion battery at all?
  link_instead_of_repeating: []
  placeholders: []
  scope:
    relations:
    - expands
    compat_limit: 80
  requires:
