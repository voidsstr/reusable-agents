    min: 10
  - check: compat_hubs_live
    min: 3
- id: sump-pump-start-and-hours
  order: 50
  slug: best-power-station-for-a-sump-pump
  working_title: 'Best power station for a sump pump: which models start a 1/2 HP pump, and for how long'
  format: best-for
  lane: station
  occasion: winter-storm-season
  brief: 'A sump pump has to start before capacity matters: the preset''s start (surge_w) against each station''s
    surge rating (surge_ok), then hours at the running draw, taken as drawn the whole time because no duty cycle
    is published. Plugged into the station only.'
  questions:
  - Which stations start a 1/2 HP pump, and which carry its running draw but cannot start it?
  - How many hours of continuous pumping does each starting station give (the worst case)?
  - Why is there no 'cycles per charge' figure?
  link_instead_of_repeating:
  - /runtime/sump-pump-half-hp
  - /best/power-station-for-sump-pump
  placeholders:
  - '{{picks:power-station-for-sump-pump}}'
  scope:
    presets:
    - sump-pump-half-hp
    lists:
    - power-station-for-sump-pump
  requires:
  - check: surge_checked_stations
    min: 10
    params:
      preset: sump-pump-half-hp
  - check: runtime_stations
    min: 10
    params:
      preset: sump-pump-half-hp
  - check: list_picks
    min: 3
    params:
      list: power-station-for-sump-pump
  - check: compat_hubs_live
    min: 2
- id: home-backup-under-1000
  order: 60
  slug: best-home-backup-power-stations-under-1000
  working_title: 'Best home backup power stations under $1,000: 1-2 kWh LiFePO4 picks'
  format: best-under
  lane: station
  occasion: winter-storm-season
  brief: 'The under-$1,000 list explained: what 1 to 2 kWh of usable energy runs in an outage (refrigerator and
    router runtimes from FACTS), chemistry and cycle life from the specs, then the ranked picks (prices render live
    in the list).'
  questions:
  - 'What does a 1-2 kWh station keep running for a day: refrigerator, router, lights?'
  - Why LiFePO4 matters for a backup station you rarely use (cycle life from the makers' specs)?
  - What do you give up at this budget compared with the $2,500 kit?
  link_instead_of_repeating:
  - /best/power-stations-under-1000
  - /kits/winter-outage-kit
  placeholders:
  - '{{picks:power-stations-under-1000}}'
  scope:
    lists:
    - power-stations-under-1000
    presets:
    - refrigerator
    - wifi-router-modem
    - led-light-bulbs
  scenario:
    kWh:
    - 1
    - 2
    h:
    - 24
  requires:
  - flag: commerce
    note: budget pages wait for live prices (L0b)
  - check: list_picks
    min: 5
    params:
      list: power-stations-under-1000
  - check: list_live
    min: 1
    params:
      list: power-stations-under-1000
  - check: compat_hubs_live
    min: 2
- id: cold-weather-voc-check
  order: 70
  slug: will-this-solar-panel-work-with-my-power-station-cold-voc
  working_title: Will this solar panel work with my power station? A cold-weather Voc check
  format: compatibility explainer
  lane: panel
  occasion: winter-storm-season
  brief: 'Why a panel that fits on a mild day can exceed a station''s solar input limit on a cold morning: our verdicts
    use -40 C, the panel''s temperature coefficient (or the NEC 690.7 factor), and 5% headroom (FACTS compat assumptions).
    Walk two or three real pairs from FACTS: a fit, an over-limit, and a series or parallel fit if FACTS has one.'
  questions:
  - Why does open-circuit voltage rise in the cold, and by how much for the pairs we checked?
  - Which panel and station pairs fit with 5% headroom, and which are over the limit?
  - When is a series or parallel connection of panels still a fit?
  link_instead_of_repeating: []
  placeholders: []
  scope:
    relations:
    - charges_from
    compat_limit: 40
  requires:
  - check: solar_fits
    min: 5
  - check: compat_hubs_live
    min: 5
